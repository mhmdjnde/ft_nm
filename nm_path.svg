<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img">
<title>The full ft_nm path, from open to one printed line</title>
<desc>open, fstat and mmap give an address; the ELF header points to the section header table; the .symtab row leads to a symbol entry; the entry's st_name looks up a name in .strtab and its st_shndx looks up a section to get the letter; both feed the final output line.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bx{fill:#ffffff;stroke:#B4B2A9;stroke-width:.5}
.hd{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.hdt{fill:#3C3489;font-weight:500;font-size:14px}
.gy{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.gyt{fill:#2C2C2A;font-weight:500;font-size:14px}
.gys{fill:#5F5E5A;font-size:12px}
.tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.tlt{fill:#04342C;font-weight:500;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tls{fill:#0F6E56;font-size:12px}
.tlm{fill:#04342C;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.r{fill:#444441;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ar{stroke:#5F5E5A;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.bx{fill:#1c1c1b;stroke:#5F5E5A}
.hd{fill:#3C3489;stroke:#AFA9EC}
.hdt{fill:#CECBF6}
.gy{fill:#444441;stroke:#B4B2A9}
.gyt{fill:#F1EFE8}
.gys{fill:#D3D1C7}
.tl{fill:#085041;stroke:#5DCAA5}
.tlt{fill:#9FE1CB}
.tls{fill:#9FE1CB}
.tlm{fill:#9FE1CB}
.r{fill:#D3D1C7}
.ar{stroke:#B4B2A9}
}
</style>
</defs>

<rect class="gy" x="75" y="50" width="150" height="46" rx="4"/>
<text class="gyt" x="150" y="70" text-anchor="middle">open()</text>
<text class="gys" x="150" y="86" text-anchor="middle">gives a fd</text>
<line class="ar" x1="225" y1="73" x2="263" y2="73" marker-end="url(#arrow)"/>

<rect class="gy" x="265" y="50" width="150" height="46" rx="4"/>
<text class="gyt" x="340" y="70" text-anchor="middle">fstat()</text>
<text class="gys" x="340" y="86" text-anchor="middle">gives the size</text>
<line class="ar" x1="415" y1="73" x2="453" y2="73" marker-end="url(#arrow)"/>

<rect class="gy" x="455" y="50" width="150" height="46" rx="4"/>
<text class="gyt" x="530" y="70" text-anchor="middle">mmap()</text>
<text class="gys" x="530" y="86" text-anchor="middle">gives an address</text>
<path class="ar" d="M530 96 V111 H440 V124" marker-end="url(#arrow)"/>

<rect class="bx" x="190" y="126" width="300" height="70" rx="4"/>
<rect class="hd" x="190" y="126" width="300" height="26" rx="4"/>
<text class="hdt" x="340" y="144" text-anchor="middle">elf header (first 64 bytes)</text>
<text class="r" x="202" y="167">class = elf64, little endian</text>
<text class="r" x="202" y="189">e_shoff -&gt; section header table</text>
<path class="ar" d="M340 196 V213 H165 V228" marker-end="url(#arrow)"/>

<rect class="bx" x="40" y="230" width="250" height="136" rx="4"/>
<rect class="hd" x="40" y="230" width="250" height="26" rx="4"/>
<text class="hdt" x="165" y="248" text-anchor="middle">section header table</text>
<text class="r" x="52" y="271">[0]</text>
<text class="r" x="278" y="271" text-anchor="end">null</text>
<text class="r" x="52" y="293">[1] .text</text>
<text class="r" x="278" y="293" text-anchor="end">progbits</text>
<rect class="tl" x="42" y="300" width="246" height="22" rx="4"/>
<text class="tlm" x="54" y="315">[3] .symtab</text>
<text class="tlm" x="276" y="315" text-anchor="end">symtab</text>
<text class="r" x="52" y="337">[4] .strtab</text>
<text class="r" x="278" y="337" text-anchor="end">strtab</text>
<text class="r" x="52" y="359">[5] .shstrtab</text>
<text class="r" x="278" y="359" text-anchor="end">strtab</text>
<line class="ar" x1="292" y1="311" x2="386" y2="311" marker-end="url(#arrow)"/>

<rect class="bx" x="390" y="230" width="250" height="114" rx="4"/>
<rect class="hd" x="390" y="230" width="250" height="26" rx="4"/>
<text class="hdt" x="515" y="248" text-anchor="middle">one .symtab entry</text>
<text class="r" x="402" y="271">st_name  = 9</text>
<text class="r" x="402" y="293">st_value = 0x1139</text>
<text class="r" x="402" y="315">st_shndx = 1</text>
<text class="r" x="402" y="337">st_info  = global, func</text>
<path class="ar" d="M470 344 V378 H165 V388" marker-end="url(#arrow)"/>
<line class="ar" x1="560" y1="344" x2="560" y2="388" marker-end="url(#arrow)"/>

<rect class="bx" x="40" y="390" width="250" height="114" rx="4"/>
<rect class="hd" x="40" y="390" width="250" height="26" rx="4"/>
<text class="hdt" x="165" y="408" text-anchor="middle">section [1] .text</text>
<text class="r" x="52" y="431">sh_flags: alloc</text>
<text class="r" x="52" y="453">sh_flags: execinstr</text>
<text class="r" x="52" y="475">so the letter is t</text>
<text class="r" x="52" y="497">bind is global, so T</text>

<rect class="bx" x="390" y="390" width="250" height="114" rx="4"/>
<rect class="hd" x="390" y="390" width="250" height="26" rx="4"/>
<text class="hdt" x="515" y="408" text-anchor="middle">.strtab, the names</text>
<text class="r" x="402" y="431">0    \0</text>
<text class="r" x="402" y="453">1    counter\0</text>
<rect class="tl" x="392" y="460" width="246" height="22" rx="4"/>
<text class="tlm" x="404" y="475">9    main\0</text>
<text class="r" x="402" y="497">14   printf\0</text>

<line class="ar" x1="165" y1="504" x2="285" y2="536" marker-end="url(#arrow)"/>
<line class="ar" x1="515" y1="504" x2="395" y2="536" marker-end="url(#arrow)"/>

<rect class="tl" x="190" y="540" width="300" height="56" rx="4"/>
<text class="tlt" x="340" y="564" text-anchor="middle">0000000000001139 T main</text>
<text class="tls" x="340" y="582" text-anchor="middle">address, letter, name</text>
</svg>
